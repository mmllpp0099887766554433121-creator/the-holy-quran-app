name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_notes:
        description: 'Release notes'
        required: false
        default: 'New release of Hasanati Islamic App'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Generate code (if needed)
      run: |
        echo "Checking if code generation is needed..."
        if [ ! -f "lib/models/quran_models.g.dart" ]; then
          echo "Generated files missing, running build_runner..."
          timeout 60s flutter pub run build_runner build --delete-conflicting-outputs || echo "Build runner failed, but continuing..."
        else
          echo "Generated files exist, skipping code generation"
        fi
      continue-on-error: true
      
    - name: Build APK
      run: flutter build apk --release
      
    - name: Build App Bundle
      run: flutter build appbundle --release
      
    - name: Get APK info
      id: apk_info
      run: |
        APK_SIZE=$(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)
        echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: حسناتي ${{ github.event.inputs.version }}
        body: |
          ## حسناتي - التطبيق الإسلامي الشامل
          
          ${{ github.event.inputs.release_notes }}
          
          ### الميزات:
          - 📖 **القرآن الكريم**: النص الكامل مع البحث والمفضلة
          - 🕌 **أسماء الله الحسنى**: 99 اسم مع المعاني والترجمة الصوتية
          - 🤲 **الأذكار والأدعية**: أذكار الصباح والمساء والنوم
          - ⏰ **مواقيت الصلاة**: حساب دقيق مع التنبيهات
          - 🧭 **اتجاه القبلة**: بوصلة دقيقة لتحديد الاتجاه
          - 📅 **التقويم الهجري**: مع المناسبات الإسلامية
          - 🌙 **الوضع الليلي**: لراحة العينين
          - 🌍 **متعدد اللغات**: عربي وإنجليزي
          - 📱 **يعمل بدون إنترنت**: جميع الميزات متاحة محلياً
          
          ### معلومات التقنية:
          - **حجم التطبيق**: ${{ steps.apk_info.outputs.apk_size }}
          - **متوافق مع**: Android 5.0+ (API 21+)
          - **المطور**: Voxin
          - **الترخيص**: مفتوح المصدر
          
          ### التحميل:
          - **APK**: للتثبيت المباشر على أجهزة Android
          - **AAB**: للمطورين والنشر على Google Play Store
          
          ### طريقة التثبيت:
          1. حمل ملف APK
          2. فعل "مصادر غير معروفة" في إعدادات الأمان
          3. اضغط على الملف لتثبيت التطبيق
          
          ---
          
          ## Hasanati - Comprehensive Islamic App
          
          ### Features:
          - 📖 **Holy Quran**: Complete text with search and bookmarks
          - 🕌 **99 Names of Allah**: With meanings and transliterations
          - 🤲 **Adhkar & Duas**: Morning, evening, and sleep prayers
          - ⏰ **Prayer Times**: Accurate calculations with notifications
          - 🧭 **Qibla Direction**: Precise compass for prayer direction
          - 📅 **Hijri Calendar**: With Islamic occasions
          - 🌙 **Dark Mode**: For comfortable reading
          - 🌍 **Multi-language**: Arabic and English
          - 📱 **Works Offline**: All features available locally
          
        files: |
          build/app/outputs/flutter-apk/app-release.apk
          build/app/outputs/bundle/release/app-release.aab
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}