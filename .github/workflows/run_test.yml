name: Run Tests

on:
  pull_request:
    branches: [master, main, feature/hasanati-islamic-app]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate code (if needed)
        run: |
          echo "Checking if code generation is needed..."
          if [ ! -f "lib/models/quran_models.g.dart" ]; then
            echo "Generated files missing, running build_runner..."
            timeout 60s flutter pub run build_runner build --delete-conflicting-outputs || echo "Build runner failed, but continuing..."
          else
            echo "Generated files exist, skipping code generation"
          fi
        continue-on-error: true

      - name: Analyze code
        run: flutter analyze
        continue-on-error: true

      - name: Run Tests
        run: flutter test
        continue-on-error: true