name: Ultra Simple Build

on:
  push:
    branches: [ feature/hasanati-islamic-app ]
  workflow_dispatch:

jobs:
  ultra-simple:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter (Ultra Simple)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.10.0'  # Using much older stable version
        channel: 'stable'
        cache: false
      timeout-minutes: 1
        
    - name: Flutter version check
      run: flutter --version
      timeout-minutes: 1
      
    - name: Get dependencies (with timeout)
      run: timeout 60 flutter pub get || echo "Dependencies timeout after 60s"
      
    - name: Check if dependencies succeeded
      run: |
        if [ -f "pubspec.lock" ]; then
          echo "Dependencies installed successfully"
          ls -la pubspec.lock
        else
          echo "Dependencies failed"
          exit 1
        fi
      
    - name: Build Debug APK (Ultra Simple)
      run: timeout 180 flutter build apk --debug --no-shrink || echo "Build timeout after 3 minutes"
      
    - name: Check APK output
      run: |
        echo "Checking APK output..."
        if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
          echo "APK built successfully!"
          ls -la build/app/outputs/flutter-apk/app-debug.apk
          file build/app/outputs/flutter-apk/app-debug.apk
        else
          echo "APK build failed"
          ls -la build/app/outputs/flutter-apk/ || echo "No APK output directory"
        fi
        
    - name: Upload Ultra Simple APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: hasanati-ultra-simple-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
        retention-days: 1