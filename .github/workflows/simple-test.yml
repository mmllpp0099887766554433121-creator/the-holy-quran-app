name: Simple Test Build

on:
  push:
    branches: [ feature/hasanati-islamic-app ]
  workflow_dispatch:

jobs:
  simple-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter (Simple)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.13.0'  # Using even older stable version
        channel: 'stable'
        cache: false  # Disable cache to avoid issues
      timeout-minutes: 2
        
    - name: Flutter doctor
      run: flutter doctor -v
      
    - name: Get dependencies
      run: flutter pub get
      
    - name: Check project structure
      run: |
        echo "Checking project structure..."
        ls -la
        echo "Checking lib directory..."
        ls -la lib/
        echo "Checking models directory..."
        ls -la lib/models/ || echo "No models directory"
      
    - name: Build Debug APK (Simple)
      run: flutter build apk --debug --no-shrink
      
    - name: Check APK output
      run: |
        echo "Checking APK output..."
        ls -la build/app/outputs/flutter-apk/ || echo "No APK output directory"
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: hasanati-simple-debug-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
        retention-days: 3