name: Build Hasanati APK

on:
  push:
    branches: [ feature/hasanati-islamic-app, master, main ]
  pull_request:
    branches: [ feature/hasanati-islamic-app, master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true
        
    - name: Flutter doctor
      run: flutter doctor -v
      
    - name: Get dependencies
      run: flutter pub get
      
    - name: Generate code
      run: flutter pub run build_runner build --delete-conflicting-outputs
      continue-on-error: true
      
    - name: Analyze code
      run: flutter analyze --no-fatal-infos
      continue-on-error: true
      
    - name: Run tests
      run: flutter test
      continue-on-error: true
      
    - name: Build Debug APK
      run: flutter build apk --debug --verbose
      
    - name: Build Release APK
      run: flutter build apk --release --verbose
      
    - name: Build App Bundle
      run: flutter build appbundle --release --verbose
      continue-on-error: true
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: hasanati-debug-apk-${{ github.run_number }}
        path: build/app/outputs/flutter-apk/app-debug.apk
        retention-days: 7
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: hasanati-release-apk-${{ github.run_number }}
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
        
    - name: Upload App Bundle
      uses: actions/upload-artifact@v4
      with:
        name: hasanati-aab-${{ github.run_number }}
        path: build/app/outputs/bundle/release/app-release.aab
        retention-days: 30
      continue-on-error: true
        
    - name: Create Release (on feature branch push)
      if: github.ref == 'refs/heads/feature/hasanati-islamic-app' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.0-build-${{ github.run_number }}
        name: حسناتي v1.0.0-build-${{ github.run_number }}
        body: |
          ## حسناتي - التطبيق الإسلامي الشامل
          
          ### الميزات الجديدة:
          - 📖 القرآن الكريم مع البحث والمفضلة
          - 🕌 أسماء الله الحسنى (99 اسم) مع المعاني
          - 🤲 الأذكار والأدعية (صباح، مساء، نوم)
          - ⏰ مواقيت الصلاة مع التنبيهات
          - 🧭 اتجاه القبلة بالبوصلة
          - 📅 التقويم الهجري
          - 🌙 الوضع الليلي والنهاري
          - 🌍 دعم اللغتين العربية والإنجليزية
          - 📱 يعمل بدون إنترنت
          
          ### معلومات التطبيق:
          - **الاسم**: حسناتي (Hasanati)
          - **المطور**: Voxin
          - **الإصدار**: 1.0.0-build-${{ github.run_number }}
          - **Build**: ${{ github.sha }}
          
          ### ملفات التحميل:
          - **APK**: للتثبيت المباشر على Android
          - **AAB**: للنشر على Google Play Store
          
        files: |
          build/app/outputs/flutter-apk/app-release.apk
          build/app/outputs/bundle/release/app-release.aab
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}