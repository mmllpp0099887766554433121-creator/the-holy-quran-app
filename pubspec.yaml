name: hasanati
description: "تطبيق حسناتي الإسلامي - القرآن الكريم والأذكار"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core dependencies
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Audio & Media
  audioplayers: ^5.2.1
  speech_to_text: ^6.6.0
  permission_handler: ^11.1.0
  
  # UI & Animation
  flutter_staggered_animations: ^1.1.1
  lottie: ^2.7.0
  flutter_svg: ^2.0.9
  
  # Date & Time
  hijri: ^3.0.0
  intl: ^0.18.1
  
  # Sensors & Location
  sensors_plus: ^4.0.2
  geolocator: ^10.1.0
  
  # Notifications
  flutter_local_notifications: ^16.3.0
  
  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utils
  vibration: ^1.8.4
  wakelock_plus: ^1.1.4
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/data/
    - assets/images/
  
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
